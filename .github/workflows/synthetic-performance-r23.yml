name: Offline synthetic performance research
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product source and offline parity before profiling
        run: npm run check
      - name: Measure generated export in real Chrome (research only)
        shell: bash
        run: |
          output="$RUNNER_TEMP/aml-r23-performance"
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || printf 'google-chrome')
          node tools/profile_offline_performance.js --chrome "$chrome" --output-dir "$output" --runs 5 --warmup 1
      - name: Retain raw timings and startup diagnostics on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-performance-r23
          path: ${{ runner.temp }}/aml-r23-performance/
          if-no-files-found: warn
