name: R13 exact candidate reconstruction (temporary feature branch only)
on:
  push:
    branches: [fix/aml-r13-visible-truncation-20261109]
    paths:
      - .r13-source-1.patch
      - .r13-source-2.patch
      - .github/workflows/r13-candidate-check.yml
permissions:
  contents: read
concurrency:
  group: aml-r13-candidate-reconstruction
  cancel-in-progress: false
jobs:
  reconstruct:
    if: >-
      github.repository == 'MAX67-gif/AI-Memory-Lifeboat' && github.ref == 'refs/heads/fix/aml-r13-visible-truncation-20261109' && github.event.head_commit.message == 'ci: stage R13 exact candidate verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable base, staging scope, patch and complete candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '224e51eca02f8c5595edf69b3bd87dd247901ed3'
          test "$(git show -s --format=%T HEAD^)" = '5741037479ce5d10d9cf90d66fdfc2056eee9b0d'
          diff -u <(printf '%s\n' '.github/workflows/r13-candidate-check.yml' '.r13-source-1.patch' '.r13-source-2.patch') <(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)
          cat .r13-source-1.patch .r13-source-2.patch > "$RUNNER_TEMP/r13-source.patch"
          echo "7f77030cb15853767f12f39a126b58dfc1bfd295bd16cd2c886606c24a3df7ae  $RUNNER_TEMP/r13-source.patch" | sha256sum -c -
          git apply --check --unidiff-zero "$RUNNER_TEMP/r13-source.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/r13-source.patch"
          rm .r13-source-1.patch .r13-source-2.patch .github/workflows/r13-candidate-check.yml
          npm run build:offline
          npm run build:manifest
          npm run check
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = '4f182f2d9976c465856c3cbe1b9570df12327d7f'
          echo 'EXACT_R13_SOURCE_TREE_AND_TESTS_PASS'
      - name: Fast-forward only the same feature branch after all checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/aml-r13-visible-truncation-20261109'
          remote="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
          test "$remote" = "$GITHUB_SHA"
          test "$(git write-tree)" = '4f182f2d9976c465856c3cbe1b9570df12327d7f'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: declare truncated text and conservative comparisons v0.10.2'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
